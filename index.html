<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <title>Resume</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Fonts -->
        <link
            href="https://fonts.googleapis.com/css?family=Nunito&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css?family=Montserrat&display=swap"
            rel="stylesheet"
        />

        <!-- UnoCSS Runtime -->
        <script src="https://cdn.jsdelivr.net/npm/@unocss/runtime"></script>
        <script>
            window.__unocss = {
                theme: {
                    fontFamily: {
                        nunito: ["Nunito", "sans-serif"],
                        montserrat: ["Montserrat", "sans-serif"],
                        system: ["system-ui", "sans-serif"],
                    },
                    colors: {
                        navy: "#000080",
                    },
                },
            };
        </script>

        <!-- Petite-Vue -->
        <script src="https://unpkg.com/petite-vue"></script>

        <style>
            /* Essential styles that can't be done with UnoCSS */
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
            }

            * {
                list-style: none;
            }

            ul {
                padding: 0;
                margin: 0;
            }

            strong {
                font-weight: bold;
            }

            /* Font family override */
            body {
                font-family: "Nunito", sans-serif !important;
                font-size: 0.90em !important;
                font-weight: 400 !important;
                line-height: 1.35;
                background: #fff;
                color: #333;
            }

            .resume-app {
                width: 100%;
                min-height: 100vh;
            }

            .resume-columns {
                display: flex;
                width: 100%;
                min-height: 100vh;
                align-items: stretch;
            }

            .main-column {
                width: 72%;
                box-sizing: border-box;
                padding: 1em 1.2em 1em 1.2em;
                border-left: 1px solid rgba(0, 0, 0, 0.05);
            }

            /* Fix link colors in main column */
            .main-column a {
                color: #0f766e !important;
                text-decoration-thickness: 1px;
                text-underline-offset: 2px;
            }

            .sidebar {
                order: -1;
                width: 28%;
                box-sizing: border-box;
                background: #14b8a6;
                color: #fff;
                padding: 0.6em 0;
                padding-left: 0.8em;
                padding-right: 0.8em;
                position: relative;
            }

            .sidebar a {
                color: #fff !important;
            }

            .sidebar .contact-link {
                text-decoration: none !important;
            }

            .sidebar .name-link {
                text-decoration: none !important;
            }

            /* QR tile: the full width of the sidebar column, square */
            .qr-tile {
                display: block;
                width: 100%;
                aspect-ratio: 1;
                margin-bottom: 1em;
                background: #fff;
                border-radius: 14px;
                overflow: hidden;
                box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
            }

            .qr-tile svg {
                display: block;
                width: 100%;
                height: 100%;
            }

            .sidebar h2 {
                border-bottom: 1.5px solid rgba(255, 255, 255, 0.3);
                <!-- font-size: 1.05em; -->
                letter-spacing: 0.05em;
            }


            .sidebar .about-text {
                font-size: 1.1em;
                line-height: 1.4;
                opacity: 0.95;
            }

            .sidebar .contact-link, .sidebar .project-link {
                font-size: 1.05em;
                opacity: 0.9;
            }

            .sidebar .degree-item {
                font-size: 1em;
                margin-bottom: 0.4em;
            }

            .sidebar .school-name {
                font-size: 1.15em;
                font-weight: 700;
            }

            /* Counter pills (resume.stats): a grid of 3 equal pills per row, wrapping;
               icon + number on top, the caption under it */
            .stat-pills {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                grid-auto-rows: 1fr;
                gap: 0.35em;
                margin: 0.5em 0 0;
            }

            .stat-pill {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 0.4em 0.1em 0.32em;
                border: 1px solid rgba(255, 255, 255, 0.35);
                border-radius: 10px;
                background: rgba(255, 255, 255, 0.14);
                white-space: nowrap;
                text-align: center;
            }

            .stat-main {
                display: flex;
                align-items: center;
                gap: 0.25em;
            }

            .stat-value {
                font-family: "Montserrat", sans-serif;
                font-weight: 800;
                font-size: 1.15em;
                line-height: 1;
                font-variant-numeric: tabular-nums;
            }

            .stat-plus {
                font-size: 0.7em;
                vertical-align: 0.3em;
            }

            .stat-caption {
                margin-top: 0.25em;
                font-size: 0.66em;
                font-weight: 700;
                line-height: 1;
                opacity: 0.88;
            }

            .dept::before {
                margin-left: 1em;
                margin-right: 1em;
                content: "  -  ";
            }

            .projects .icon {
                display: none;
            }

            .work-experience-list > li {
                margin-bottom: 0.9em;
                padding-bottom: 0.5em;
                border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            }

            .work-experience-list > li:last-child {
                margin-bottom: 0;
                padding-bottom: 0;
                border-bottom: none;
            }

            .job-time {
                color: rgba(0, 0, 0, 0.5);
                font-weight: 600;
                font-size: 0.85em;
                font-variant-numeric: tabular-nums;
                letter-spacing: 0.02em;
            }

            .job-heading {
                font-size: 1.05em;
                line-height: 1.2;
            }

            .job-title {
                font-weight: 800;
                color: #1a1a1a;
            }

            .job-company {
                font-style: italic;
                font-weight: 600;
                color: #14b8a6;
            }

            .job-scope {
                font-size: 0.82em;
                font-weight: 600;
                color: rgba(0, 0, 0, 0.45);
                text-transform: uppercase;
                letter-spacing: 0.03em;
            }

            .responsibility-item {
                position: relative;
                padding-left: 0.1em;
                margin-bottom: 0.15em;
                line-height: 1.25;
                font-size: 0.92em;
            }

            .job-tech-chips {
                display: flex;
                flex-wrap: wrap;
                justify-content: flex-end;
                gap: 0.3em;
                margin-top: 0.4em;
            }

            .job-tech-chip {
                display: inline-block;
                padding: 0.2em 0.7em;
                border: 1px solid rgba(20, 184, 166, 0.15);
                border-radius: 6px;
                background: rgba(20, 184, 166, 0.05);
                color: #0f766e;
                font-size: 0.85em;
                font-weight: 700;
                line-height: 1.2;
            }

            /* Print rules for conflicts */
            @page {
                margin: 0;
            }

            @media print {
                html,
                body {
                    margin: 0 !important;
                    padding: 0 !important;
                    -webkit-print-color-adjust: exact;
                    print-color-adjust: exact;
                }

                .resume-app,
                .resume-columns {
                    min-height: 100vh;
                }

                .about {
                    <!-- font-size: 1em !important; -->
                }

                .picture img {
                    width: 8em !important;
                }

                .technologies {
                    margin-top: -0.5em !important;
                    margin-bottom: 0 !important;
                }

                .technologies ul {
                    margin-right: 2em !important;
                    margin-bottom: 0em !important;
                }
            }
        </style>
    </head>

    <body class="font-nunito w-full">
        <div v-scope="ResumeApp()" @vue:mounted="loadResume" class="resume-app">
            <!-- Column Container -->
            <div class="resume-columns">
                <!-- Side Column - Info -->
                <div class="sidebar text-left">
                    <section class="info pt-1 pb-1">
                        <!-- QR code to the site (or a personal /r/<code> link), see qrTarget() -->
                        <a
                            v-if="qr.svg"
                            :href="qr.url"
                            class="qr-tile"
                            :title="qr.url"
                            v-html="qr.svg"
                        ></a>

                        <!-- Name -->
                        <h1 class="mt-1  ml-1 mb-1 leading-tight text-[2.5em] font-montserrat font-extrabold tracking-tight text-left">
                            <a
                                :href="resume.personalInfo?.website"
                                class="name-link"
                                v-html="resume.personalInfo?.name"
                            ></a>
                        </h1>

                        <!-- Job Title -->
                        <div
                            class="italic font-medium text-[1.15em] text-left mt-0.5 mb-2 ml-1 opacity-90 tracking-wide"
                            v-text="resume.personalInfo?.title"
                        ></div>

                        <!-- Picture -->
                        <div class="hidden pl-[2em] text-center" hidden>
                            <img
                                src="src/pro.jpg"
                                alt="Picture"
                                class="w-[15em] rounded-full"
                            />
                        </div>
                    </section>

                    <!-- About -->
                    <section v-if="resume.about" class="text-left ml-1">
                        <div class="about-text">
                            <p class="mt-0" v-text="resume.about"></p>
                        </div>
                    </section>

                    <!-- Contact -->
                    <h2 class="font-montserrat font-medium uppercase">
                        Links & Contact
                    </h2>
                    <section v-if="resume.contact" class="text-left mb-2 ml-2">
                        <ul>
                            <li
                                v-for="(contactItem, index) in resume.contact"
                                :key="index"
                                class="flex items-start justify-start gap-[0.7em] text-left mb-2.5"
                                v-show="!contactItem.hidden"
                            >
                                <span
                                    :style="getIconStyle(contactItem.icon, { size: 1.1, white: true })"
                                ></span>
                                <span v-if="contactItem.text.includes('@')">
                                    <a
                                        :href="contactItem.href"
                                        class="contact-link"
                                        v-text="contactItem.text.split('@')[0]"
                                    ></a>
                                    <div class="text-[0.8em] text-left opacity-80 -mt-0.5 leading-tight"
                                        v-text="'@' + contactItem.text.split('@')[1]"
                                    ></div>
                                </span>
                                <a
                                    v-else
                                    :href="contactItem.href"
                                    class="contact-link"
                                    v-text="contactItem.text"
                                ></a>
                            </li>
                        </ul>
                    </section>

                    <!-- Education -->
                    <h2 class="font-montserrat font-medium uppercase">
                        Education
                    </h2>
                    <section v-if="resume.education" class="text-left mb-2">
                        <div>
                            <h3 class="school-name mb-1" v-text="resume.education.school"></h3>
                            <div
                                v-for="(degree, index) in resume.education.degrees"
                                :key="index"
                                class="degree-item italic opacity-90"
                                v-text="degree"
                            ></div>
                            <div class="mt-2 ml-2 text-[0.95em] opacity-80 leading-snug">
                                <span v-text="resume.education.description"></span>
                            </div>
                        </div>
                    </section>

                    <!-- Products: counter pills from resume.stats.items (a pill whose value is 0 or
                         empty is hidden). ?statsCaptions=0 drops the captions.
                         resume.projects (the old product list) is kept in the JSON but no longer shown. -->
                    <template v-if="stats.items.length">
                        <h2 class="font-montserrat font-medium uppercase" v-text="stats.heading"></h2>
                        <ul class="stat-pills mb-2">
                            <li
                                v-for="stat in stats.items"
                                :key="stat.id"
                                class="stat-pill"
                                :title="stat.label"
                            >
                                <span class="sr-only" v-text="stat.label"></span>
                                <span class="stat-main" aria-hidden="true">
                                    <span :style="getIconStyle(stat.icon, { size: 1 })"></span>
                                    <span class="stat-value"><span v-text="String(stat.value).replace(/\+$/, '')"></span><span v-if="String(stat.value).endsWith('+')" class="stat-plus">+</span></span>
                                </span>
                                <span
                                    v-if="stats.captions && stat.caption"
                                    class="stat-caption"
                                    aria-hidden="true"
                                    v-text="stat.caption"
                                ></span>
                            </li>
                        </ul>
                    </template>
                </div>

                <!-- Main Column - Work Experience -->
                <div class="main-column text-left">
                    <!-- Work Experience -->
                    <h2 class="text-[1.3em] font-montserrat font-extrabold uppercase tracking-tight mb-3 text-teal-600">Work Experience</h2>
                    <ul
                        class="work-experience-list text-left ml-0 mt-2 pl-0"
                        v-if="resume.workExperience"
                    >
                        <li
                            v-for="(job, index) in resume.workExperience"
                            :key="index"
                            v-show="!job.hidden"
                        >
                            <div
                                class="flex items-baseline justify-between gap-4 mb-1 mr-4"
                            >
                                <h3 class="job-heading m-0">
                                    <span
                                        class="job-title"
                                    ><span v-if="job.jobTitlePrefix && !job.hidePrefix" v-text="job.jobTitlePrefix + ' '"></span><span v-text="job.jobTitle"></span></span>
                                </h3>
                                <div class="flex items-baseline gap-3">
                                    <span
                                        v-if="job.company"
                                        class="job-company"
                                        v-text="job.company"
                                    ></span>
                                    <h3
                                        class="job-time m-0 text-right whitespace-nowrap"
                                        v-text="job.time"
                                    ></h3>
                                </div>
                            </div>
                            <div
                                v-if="job.unifiedScope"
                                class="job-scope mb-2"
                                v-text="job.unifiedScope"
                            ></div>
                            <ul class="text-left mb-3 pl-0">
                                <li
                                    v-for="(responsibility, respIndex) in job.responsibilities"
                                    :key="respIndex"
                                    class="responsibility-item"
                                >
                                    <span
                                        v-for="(line, lineIndex) in getResponsibilityLines(responsibility)"
                                        :key="lineIndex"
                                        v-text="line"
                                    ></span>
                                </li>
                            </ul>
                            <ul
                                v-if="getJobTechList(job).length"
                                class="job-tech-chips"
                            >
                                <li
                                    v-for="(tech, techIndex) in getJobTechList(job)"
                                    :key="techIndex"
                                    class="job-tech-chip"
                                    v-text="tech"
                                ></li>
                            </ul>
                        </li>
                    </ul>
                </div>

                <!-- Bottom Technologies Section -->
                <section
                    v-if="resume.technologies?.detailed"
                    class="-mt-[0.5em] text-left w-full clear-both"
                    hidden
                >
                    <h2
                        class="mb-0 font-montserrat font-medium uppercase mb-[5px]"
                    >
                        Technologies
                    </h2>
                    <div
                        class="mt-0 w-full flex justify-between flex-wrap text-[1.3em]"
                    >
                        <ul
                            v-for="(techs, category) in resume.technologies.detailed"
                            :key="category"
                            class="mt-[1em] flex-1 mr-[2em] last:mr-0"
                        >
                            <li
                                v-for="(tech, index) in techs"
                                :key="index"
                                class="flex items-center gap-2 mb-1"
                            >
                                <span :style="getIconStyle(tech)"></span>
                                <span v-if="tech === 'Svelte / React'">
                                    <span
                                        :style="getIconStyle('React')"
                                        class="inline-block mr-1"
                                    ></span>
                                    <span v-text="tech"></span>
                                </span>
                                <span v-else v-text="tech"></span>
                            </li>
                        </ul>
                    </div>
                </section>
            </div>
        </div>

        <!-- QR encoder (Kazuhiko Arase's qrcode-generator 1.4.4, MIT), vendored -->
        <script src="src/vendor/qrcode.js"></script>
        <script>
            const QR_SITE = "https://www.andreadecandia.com";
            const QR_DEFAULT_COLOR = "#134e4a"; // teal-900, ~9.9:1 on white
            const QR_FALLBACK_COLOR = "#111111";
            const QR_QUIET = 4; // quiet zone, in modules
            // Logo-in-dots style (?qrShape=): finder eyes and the dark modules outside the shape
            const QR_EYE_COLOR = "#27272a"; // zinc-800
            const QR_OUTSIDE_COLOR = "#a1a1aa"; // zinc-400: light, so the logo stands out (scans less well when blurred)
            // Dots outside the shape are smaller, so the shape reads. Below ~0.4 they blur away
            // first: at 0.32 zxing failed on blurred / tilted renders the 0.4 dots survive.
            const QR_OUTSIDE_RADIUS = 0.4;
            const QR_FALLBACK_TINT = "#e4e4e7"; // zinc-200, the tint when the brand color is too light
            const QR_SHAPE_VERSION = 10; // 57x57 modules: a smoother silhouette
            const QR_SHAPE_SPAN = 0.9; // the shape spans 90% of the module grid
            const QR_SHAPE_TINT = 0.78; // light modules inside: brand color mixed with 78% white

            // What the QR encodes: ?code=k7q -> /r/k7q, otherwise the site with the
            // résumé UTM tag (+ utm_campaign when ?ref= is set).
            function qrTarget(params) {
                const code = params.get("code");
                if (code) {
                    if (/^[a-z0-9]{3}$/.test(code)) return `${QR_SITE}/r/${code}`;
                    console.warn(`QR: ignoring code "${code}" (want 3 lowercase letters/digits)`);
                }
                const ref = params.get("ref");
                return `${QR_SITE}/?utm_source=resume` +
                    (ref ? `&utm_campaign=${encodeURIComponent(ref)}` : "");
            }

            // WCAG contrast ratio of a #rrggbb color against white.
            function contrastOnWhite(hex) {
                const lum = [1, 3, 5]
                    .map((i) => parseInt(hex.slice(i, i + 2), 16) / 255)
                    .map((c) => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4));
                const L = 0.2126 * lum[0] + 0.7152 * lum[1] + 0.0722 * lum[2];
                return 1.05 / (L + 0.05);
            }

            // ?qrColor=0b5fff (no #). Too light to scan (< 4.5:1 on white) -> near-black.
            function qrColor(raw) {
                if (!raw) return QR_DEFAULT_COLOR;
                const hex = "#" + raw.replace(/^#/, "").toLowerCase();
                if (!/^#[0-9a-f]{6}$/.test(hex)) {
                    console.warn(`QR: qrColor "${raw}" is not a 6-digit hex; using ${QR_FALLBACK_COLOR}`);
                    return QR_FALLBACK_COLOR;
                }
                const ratio = contrastOnWhite(hex);
                if (ratio < 4.5) {
                    // Too light to scan: darken it (same hue) until it reaches 4.5:1.
                    let dark = hex;
                    for (let k = 0.98; contrastOnWhite(dark) < 4.5 && k > 0.2; k -= 0.02) {
                        dark = "#" + [1, 3, 5]
                            .map((i) => Math.round(parseInt(hex.slice(i, i + 2), 16) * k).toString(16).padStart(2, "0"))
                            .join("");
                    }
                    console.warn(`QR: qrColor ${hex} has contrast ${ratio.toFixed(2)}:1 on white (< 4.5); darkened to ${dark}`);
                    return contrastOnWhite(dark) >= 4.5 ? dark : QR_FALLBACK_COLOR;
                }
                return hex;
            }

            // Mix a #rrggbb color with white; `white` is the share of white (0..1).
            function mixWithWhite(hex, white) {
                return "#" + [1, 3, 5]
                    .map((i) => parseInt(hex.slice(i, i + 2), 16))
                    .map((c) => Math.round(c + (255 - c) * white).toString(16).padStart(2, "0"))
                    .join("");
            }

            // The silhouette for the logo-in-dots style: an SVG or PNG (its alpha, or its
            // darkness when the image is opaque), cropped to the shape's bounding box, scaled
            // to span QR_SHAPE_SPAN of the n x n module grid and centered, rasterized at `px`
            // pixels per module. Returns inside(r, c): true when over half the module is covered.
            async function loadQrShape(src, n, px = 16) {
                let url = src, revoke = null;
                if (/\.svg(\?|#|$)/i.test(src) || src.startsWith("data:image/svg")) {
                    // Give the SVG a large intrinsic size so it rasterizes sharply.
                    const doc = new DOMParser().parseFromString(await (await fetch(src)).text(), "image/svg+xml");
                    const root = doc.documentElement;
                    let [, , vw, vh] = (root.getAttribute("viewBox") || "").split(/[\s,]+/).map(Number);
                    if (!vw || !vh) [vw, vh] = [parseFloat(root.getAttribute("width")) || 100, parseFloat(root.getAttribute("height")) || 100];
                    root.setAttribute("width", Math.round(1024 * (vw / Math.max(vw, vh))));
                    root.setAttribute("height", Math.round(1024 * (vh / Math.max(vw, vh))));
                    url = revoke = URL.createObjectURL(
                        new Blob([new XMLSerializer().serializeToString(doc)], { type: "image/svg+xml" }),
                    );
                }
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.src = url;
                try {
                    await img.decode();
                } finally {
                    if (revoke) URL.revokeObjectURL(revoke);
                }

                // 1. The image as a coverage mask (alpha = how much of the shape each pixel is).
                const iw = img.naturalWidth, ih = img.naturalHeight;
                const source = document.createElement("canvas");
                source.width = iw;
                source.height = ih;
                const sctx = source.getContext("2d", { willReadFrequently: true });
                sctx.drawImage(img, 0, 0);
                const pixels = sctx.getImageData(0, 0, iw, ih); // throws on a tainted canvas
                const d = pixels.data;
                let opaque = true;
                for (let i = 3; i < d.length; i += 4) if (d[i] < 250) { opaque = false; break; }
                let x0 = iw, y0 = ih, x1 = -1, y1 = -1;
                for (let y = 0; y < ih; y++) {
                    for (let x = 0; x < iw; x++) {
                        const i = (y * iw + x) * 4;
                        const cover = opaque
                            ? 255 - (0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2])
                            : d[i + 3];
                        d[i] = d[i + 1] = d[i + 2] = 0;
                        d[i + 3] = cover;
                        if (cover > 25) {
                            if (x < x0) x0 = x;
                            if (x > x1) x1 = x;
                            if (y < y0) y0 = y;
                            if (y > y1) y1 = y;
                        }
                    }
                }
                if (x1 < 0) throw new Error("the shape is empty");
                sctx.putImageData(pixels, 0, 0);

                // 2. Its bounding box, fitted into the grid.
                const W = n * px, bw = x1 - x0 + 1, bh = y1 - y0 + 1;
                const k = (W * QR_SHAPE_SPAN) / Math.max(bw, bh);
                const grid = document.createElement("canvas");
                grid.width = grid.height = W;
                const gctx = grid.getContext("2d", { willReadFrequently: true });
                gctx.drawImage(source, x0, y0, bw, bh, (W - bw * k) / 2, (W - bh * k) / 2, bw * k, bh * k);
                const g = gctx.getImageData(0, 0, W, W).data;

                // 3. One flag per module: covered more than half.
                const inside = [];
                for (let r = 0; r < n; r++) {
                    const row = [];
                    for (let c = 0; c < n; c++) {
                        let sum = 0;
                        for (let y = r * px; y < (r + 1) * px; y++)
                            for (let x = c * px; x < (c + 1) * px; x++) sum += g[(y * W + x) * 4 + 3];
                        row.push(sum / (255 * px * px) > 0.5);
                    }
                    inside.push(row);
                }
                return (r, c) => inside[r][c];
            }

            const escAttr = (v) => String(v).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);

            // Inline SVG from the module matrix: dot modules and rounded finder eyes, error
            // correction M. `shape` (an SVG/PNG silhouette) switches to the logo-in-dots style: version 7,
            // error correction H, and the dots inside the silhouette drawn in the brand color.
            async function buildQrSvg(text, { color = QR_DEFAULT_COLOR, shape = null, square = false } = {}) {
                let qr = null;
                for (let v = shape ? QR_SHAPE_VERSION : 0; !qr; v++) {
                    // Too much data for this version -> try the next one up.
                    try {
                        const candidate = qrcode(v, shape ? "H" : "M");
                        candidate.addData(text);
                        candidate.make();
                        qr = candidate;
                    } catch (e) {
                        if (!v || v >= 40) throw e;
                    }
                }
                const n = qr.getModuleCount();
                const q = QR_QUIET;
                const size = n + 2 * q;

                let inside = null, tint = null;
                if (shape) {
                    try {
                        inside = await loadQrShape(shape, n);
                        tint = color === QR_FALLBACK_COLOR ? QR_FALLBACK_TINT : mixWithWhite(color, QR_SHAPE_TINT);
                    } catch (e) {
                        console.warn(`QR: could not read the shape "${shape}" (${e.message}); drawing a plain code`);
                    }
                }

                const inFinder = (r, c) =>
                    (r < 7 && c < 7) || (r < 7 && c >= n - 7) || (r >= n - 7 && c < 7);

                const roundRect = (x, y, w, h, r) =>
                    `M${x + r},${y}h${w - 2 * r}a${r},${r} 0 0 1 ${r},${r}v${h - 2 * r}` +
                    `a${r},${r} 0 0 1 -${r},${r}h-${w - 2 * r}a${r},${r} 0 0 1 -${r},-${r}` +
                    `v-${h - 2 * r}a${r},${r} 0 0 1 ${r},-${r}z`;

                // A circle as a path: two arcs.
                const dot = (r, c, rad) => {
                    const cx = c + q + 0.5, cy = r + q + 0.5;
                    return `M${cx - rad},${cy}a${rad},${rad} 0 1 0 ${2 * rad},0a${rad},${rad} 0 1 0 -${2 * rad},0z`;
                };
                // The finders plus their one-module light separator.
                const nearFinder = (r, c) =>
                    (r < 8 && c < 8) || (r < 8 && c >= n - 8) || (r >= n - 8 && c < 8);

                let dots = "", outsideDots = "", tintDots = "";
                for (let r = 0; r < n; r++) {
                    for (let c = 0; c < n; c++) {
                        if (inFinder(r, c)) continue;
                        const dark = qr.isDark(r, c);
                        if (inside) {
                            // Logo-in-dots: brand dots inside the shape, small grey dots outside,
                            // pale tint dots on the light modules inside.
                            const isIn = inside(r, c);
                            if (dark && isIn) dots += dot(r, c, 0.5);
                            else if (dark) outsideDots += dot(r, c, QR_OUTSIDE_RADIUS);
                            else if (isIn && !nearFinder(r, c)) tintDots += dot(r, c, 0.5);
                            continue;
                        }
                        if (!dark) continue;
                        if (square) {
                            dots += `M${c + q},${r + q}h1v1h-1z`;
                            continue;
                        }
                        dots += dot(r, c, 0.48); // 0.45 failed OpenCV at 300 dpi on the large tile
                    }
                }

                let eyes = "";
                for (const [r, c] of [[0, 0], [0, n - 7], [n - 7, 0]]) {
                    const x = c + q, y = r + q;
                    // Softly rounded ring, round-cornered pupil. Rounder outer rings
                    // (r >= ~0.7) stop some decoders (OpenCV) from locating the code.
                    const [r1, r2, r3] = square ? [0, 0, 0] : [0.5, 0.3, 0.8];
                    eyes += roundRect(x, y, 7, 7, r1) + roundRect(x + 1, y + 1, 5, 5, r2);
                    eyes += roundRect(x + 2, y + 2, 3, 3, r3);
                }

                return (
                    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" ` +
                    `role="img" aria-label="QR code: ${escAttr(text)}">` +
                    `<rect width="${size}" height="${size}" fill="#fff"/>` +
                    (tintDots ? `<path fill="${tint}" d="${tintDots}"/>` : "") +
                    (outsideDots ? `<path fill="${QR_OUTSIDE_COLOR}" d="${outsideDots}"/>` : "") +
                    `<path fill="${color}" d="${dots}"/>` +
                    `<path fill="${inside ? QR_EYE_COLOR : color}" fill-rule="evenodd" d="${eyes}"/>` +
                    `</svg>`
                );
            }

            function ResumeApp() {
                return {
                    resume: {},
                    icons: {},
                    qr: { url: "", svg: "" },
                    stats: { heading: "", items: [], captions: true },

                    async loadResume() {
                        try {
                            const [resumeResponse, iconsResponse] =
                                await Promise.all([
                                    fetch("./resume.json"),
                                    fetch("./icons.json"),
                                ]);
                            this.resume = await resumeResponse.json();
                            this.icons = await iconsResponse.json();

                            // Handle tracking parameters from URL
                            const urlParams = new URLSearchParams(window.location.search);
                            const ref = urlParams.get("ref");
                            const job = urlParams.get("job");

                            // Products pills, after Education: hidden while a value is 0 or empty
                            this.stats = {
                                heading: this.resume.stats?.heading || "Products",
                                items: (this.resume.stats?.items || []).filter(
                                    (s) => s.value !== undefined && s.value !== null && !/^\s*0*\s*$/.test(String(s.value)),
                                ),
                                captions: urlParams.get("statsCaptions") !== "0",
                            };

                            // QR in the top-left: ?code=, ?ref=, ?qrColor=, ?qrShape=
                            const qrUrl = qrTarget(urlParams);
                            this.qr = {
                                url: qrUrl,
                                svg: await buildQrSvg(qrUrl, {
                                    color: qrColor(urlParams.get("qrColor")),
                                    shape: urlParams.get("qrShape"),
                                    square: urlParams.get("qrStyle") === "square",
                                }),
                            };

                            // ?region=eu prints the European version (cv.pdf): contact
                            // entries tagged with a region show only in that version.
                            const region = urlParams.get("region") || "us";
                            this.resume.contact = (this.resume.contact || []).filter(
                                (c) => !c.region || c.region === region,
                            );

                            const updateLinks = (obj) => {
                                if (obj.href && obj.href.includes("andrea-dev.com")) {
                                    if (ref) {
                                        const sep = obj.href.includes("?") ? "&" : "?";
                                        obj.href += `${sep}utm_campaign=${ref}`;
                                    }
                                    if (job) {
                                        const sep = obj.href.includes("?") ? "&" : "?";
                                        // Use encodeURIComponent for the job URL
                                        obj.href += `${sep}utm_content=${encodeURIComponent(job)}`;
                                    }
                                }
                            };

                            if (ref || job) {
                                if (this.resume.contact) {
                                    this.resume.contact.forEach(updateLinks);
                                }
                                if (this.resume.personalInfo?.website) {
                                    // Wrap in object to use the same helper
                                    const mockObj = { href: this.resume.personalInfo.website };
                                    updateLinks(mockObj);
                                    this.resume.personalInfo.website = mockObj.href;
                                }
                            }

                            console.log("Resume loaded:", this.resume);
                            console.log("Icons loaded:", this.icons);
                        } catch (error) {
                            console.error("Error loading data:", error);
                        }
                    },

                    getIconStyle(iconName, options = {}) {
                        const iconPath = this.icons[iconName];
                        const iconSize = options.size || 1.5;
                        return iconPath
                            ? {
                                  backgroundImage: `url(${iconPath})`,
                                  backgroundSize: "contain",
                                  backgroundRepeat: "no-repeat",
                                  backgroundPosition: "center",
                                  display: "inline-block",
                                  width: `${iconSize}em`,
                                  height: `${iconSize}em`,
                                  ...(options.white
                                      ? { filter: "brightness(0) invert(1)" }
                                      : {}),
                              }
                            : {};
                    },

                    getResponsibilityLines(responsibility) {
                        if (
                            responsibility &&
                            typeof responsibility === "object"
                        ) {
                            if (
                                Array.isArray(responsibility.details) &&
                                responsibility.details.length
                            ) {
                                return responsibility.details;
                            }

                            if (responsibility.description) {
                                return [responsibility.description];
                            }

                            return [];
                        }

                        if (
                            typeof responsibility === "string" &&
                            responsibility.trim()
                        ) {
                            return [responsibility];
                        }

                        return [];
                    },

                    getJobTechList(job) {
                        if (!job || !Array.isArray(job.responsibilities)) {
                            return [];
                        }

                        const uniqueTech = [];
                        const seenTech = new Set();

                        for (const responsibility of job.responsibilities) {
                            if (
                                !responsibility ||
                                typeof responsibility !== "object" ||
                                !responsibility.tech
                            ) {
                                continue;
                            }

                            const parsedTech = String(responsibility.tech)
                                .replace(/<[^>]+>/g, "")
                                .split(",")
                                .map((tech) => tech.trim())
                                .filter(Boolean);

                            for (const tech of parsedTech) {
                                const normalized = tech.toLowerCase();
                                if (!seenTech.has(normalized)) {
                                    seenTech.add(normalized);
                                    uniqueTech.push(tech);
                                }
                            }
                        }

                        return uniqueTech;
                    },

                    getJobTech(job) {
                        return this.getJobTechList(job).join(", ");
                    },
                };
            }

            // Initialize Petite-Vue
            PetiteVue.createApp().mount();
        </script>
    </body>
</html>
